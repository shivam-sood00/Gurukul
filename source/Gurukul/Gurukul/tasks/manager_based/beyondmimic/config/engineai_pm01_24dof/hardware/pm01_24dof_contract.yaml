# EngineAI PM01 24-DoF policy-to-hardware contract.
# Numeric policy parameters mirror pretrained/deploy_config.yaml.
source:
  rl_lab_commit: "14ec57be718586bd0ac45375aa1115bd896fbdbc"
  native_sdk_commit: "83204a459e0e786f855235a8507197496a79acc7"

timing:
  policy_period_s: 0.02
  policy_frequency_hz: 50
  low_level_period_s: 0.002
  low_level_frequency_hz: 500

control:
  type: position_residual
  resident_control: false
  target_equation: "default_joint_pos + action * action_scale"
  observation_names:
    [command, motion_anchor_ori_b, base_ang_vel, joint_pos, joint_vel, actions]
  observation_history_lengths: [1, 1, 1, 1, 1, 1]
  observation_dim: 129
  action_dim: 24

# EngineAI hardware/native-SDK total-limb order.
